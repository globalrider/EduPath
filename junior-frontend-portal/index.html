<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EduPath Junior Portal — Learn from seniors and alumni about academics, placements, and career preparation.">
  <title>EduPath — Junior Portal</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- ═══════════════════════════════════════════
       TOP HEADER
       ═══════════════════════════════════════════ -->
  <header class="header" role="banner">
    <div class="header__brand">
      <span class="header__logo" aria-hidden="true">
        <!-- Graduation-cap SVG icon -->
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c0 1.1 2.7 3 6 3s6-1.9 6-3v-5"/>
        </svg>
      </span>
      <div class="header__titles">
        <h1 class="header__name">EduPath</h1>
        <span class="header__subtitle">Junior Portal</span>
      </div>
    </div>

    <!-- Profile chip (placeholder data) — clickable to open My Profile -->
    <button class="header__profile" id="header-profile-btn"
            type="button"
            aria-label="Open my profile">
      <span class="avatar avatar--sm" aria-hidden="true">AK</span>
      <span class="header__user-name">Arun Kumar</span>
    </button>
  </header>

  <!-- ═══════════════════════════════════════════
       APP SHELL: SIDEBAR + MAIN CONTENT
       ═══════════════════════════════════════════ -->
  <div class="app">
    <!-- LEFT SIDEBAR -->
    <nav class="sidebar" role="navigation" aria-label="Main navigation">
      <ul class="sidebar__list" role="list">
        <!-- Senior Posts -->
        <li>
          <button class="sidebar__item sidebar__item--active"
                  data-view="senior-posts"
                  type="button"
                  aria-current="page">
            <svg class="sidebar__icon" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
              <line x1="8" y1="7" x2="16" y2="7"/>
              <line x1="8" y1="11" x2="14" y2="11"/>
            </svg>
            <span>Senior Posts</span>
          </button>
        </li>

        <!-- Raise a Question -->
        <li>
          <button class="sidebar__item"
                  data-view="raise-question"
                  type="button">
            <svg class="sidebar__icon" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10"/>
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
              <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
            <span>Raise a Question</span>
          </button>
        </li>

        <!-- My Profile -->
        <li>
          <button class="sidebar__item"
                  data-view="my-profile"
                  type="button">
            <svg class="sidebar__icon" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <span>My Profile</span>
          </button>
        </li>
      </ul>
    </nav>

    <!-- MAIN CONTENT AREA -->
    <main class="content" id="main-content" role="main" aria-live="polite">
      <!-- Populated by JavaScript -->
    </main>
  </div>

  <!-- ═══════════════════════════════════════════
       TOAST NOTIFICATION CONTAINER
       ═══════════════════════════════════════════ -->
  <div class="toast-container" id="toast-container" aria-live="assertive" aria-atomic="true"></div>

  <script src="js/app.js"></script>
</body>
</html>
