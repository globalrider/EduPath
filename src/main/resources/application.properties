spring.application.name=EduPath-Backend
server.port=8080

# =========================================================================
# ACTIVE DATABASE PROFILE
# =========================================================================
# 'h2' is the default so clicking "Run" in your IDE works immediately
# without needing MySQL to be running!
#
# When your MySQL server is running, change this line to:
# spring.profiles.active=mysql
# =========================================================================
spring.profiles.active=h2

# Disable auto-running SQL scripts since Hibernate manages the schema
spring.sql.init.mode=never

# Jackson JSON Formatter
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata

# Gemini AI Roadmap Generation Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}

