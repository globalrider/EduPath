<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EduPath Junior Portal — Learn from seniors and alumni about academics, placements, and career preparation.">
  <title>EduPath — Junior Portal</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    /* Topbar switch pills */
    .switch {
      display: flex;
      gap: 0.25rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.2rem;
    }
    .switch a {
      padding: 0.35rem 0.85rem;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .switch a:hover {
      color: var(--text);
    }
    .switch a.active {
      background: var(--primary);
      color: #fff;
    }
    .header__nav-center {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    @media (max-width: 768px) {
      .header__nav-center {
        display: none;
      }
    }
  </style>
  <script>
    // Strict authentication gate
    (function() {
      const token = localStorage.getItem("jwt");
      const userStr = localStorage.getItem("user");
      if (!token || !userStr) {
        window.location.href = "/login.html";
        return;
      }
      try {
        const user = JSON.parse(userStr);
        const role = (user.role || "").toUpperCase();
        if (role === "SENIOR" || role === "ALUMNI") {
          window.location.href = "/senior.html";
        }
      } catch (_) {
        window.location.href = "/login.html";
      }
    })();
  </script>

  <!-- TOP HEADER -->
  <header class="header" role="banner">
    <div class="header__brand">
      <a href="/" style="display:flex;align-items:center;gap:0.6rem;text-decoration:none;color:inherit;">
        <span class="header__logo" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c0 1.1 2.7 3 6 3s6-1.9 6-3v-5"/>
          </svg>
        </span>
        <div class="header__titles">
          <h1 class="header__name">EduPath</h1>
          <span class="header__subtitle">Junior Student Portal</span>
        </div>
      </a>
    </div>

    <!-- Right Profile & Sign Out -->
    <div style="display:flex;align-items:center;gap:0.75rem;">
      <button class="header__profile" id="header-profile-btn"
              type="button"
              aria-label="Open my profile">
        <span class="avatar avatar--sm" id="user-avatar-initials" aria-hidden="true">VK</span>
        <span class="header__user-name" id="user-display-name">Junior Student</span>
      </button>

      <button type="button" class="btn-signout" onclick="signOut()" style="background:#fff;border:1px solid var(--border);border-radius:6px;padding:0.45rem 0.85rem;font-size:0.82rem;font-weight:600;color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:0.35rem;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        Sign Out
      </button>
    </div>
  </header>

  <!-- APP SHELL: SIDEBAR + MAIN CONTENT -->
  <div class="app">
    <!-- LEFT SIDEBAR -->
    <nav class="sidebar" role="navigation" aria-label="Main navigation">
      <ul class="sidebar__list" role="list">
        <!-- Senior Posts -->
        <li>
          <button class="sidebar__item sidebar__item--active"
                  data-view="senior-posts"
                  type="button"
                  aria-current="page">
            <svg class="sidebar__icon" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
              <line x1="8" y1="7" x2="16" y2="7"/>
              <line x1="8" y1="11" x2="14" y2="11"/>
            </svg>
            <span>Senior Posts</span>
          </button>
        </li>

        <!-- Raise a Question -->
        <li>
          <button class="sidebar__item"
                  data-view="raise-question"
                  type="button">
            <svg class="sidebar__icon" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10"/>
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
              <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
            <span>Raise a Question</span>
          </button>
        </li>

        <!-- AI Career Roadmaps -->
        <li>
          <button class="sidebar__item"
                  data-view="career-roadmaps"
                  type="button">
            <svg class="sidebar__icon" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
            <span>AI Roadmaps</span>
          </button>
        </li>

        <!-- My Profile -->
        <li>
          <button class="sidebar__item"
                  data-view="my-profile"
                  type="button">
            <svg class="sidebar__icon" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <span>My Profile</span>
          </button>
        </li>
      </ul>
    </nav>

    <!-- MAIN CONTENT AREA -->
    <main class="content" id="main-content" role="main" aria-live="polite">
      <!-- Populated by JavaScript -->
    </main>
  </div>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div class="toast-container" id="toast-container" aria-live="assertive" aria-atomic="true"></div>

  <script src="/js/app.js"></script>
</body>
</html>
